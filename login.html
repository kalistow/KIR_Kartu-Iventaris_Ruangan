<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin — SIMBAR Kesbangpol</title>
    <script>
        // Redirect to index if already logged in or in demo mode
        (function() {
            const isDemo = localStorage.getItem('simbar.isDemo') === 'true';
            const localSession = localStorage.getItem('supabase.session');
            if (isDemo || localSession) {
                window.location.replace('index.html');
            }
        })();
    </script>
    <meta name="description"
        content="Halaman login admin Sistem Inventaris Barang (SIMBAR) Kesbangpol Kesatuan Bangsa dan Politik." />

    <!-- Google Fonts: Roboto Flex -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100..1000&display=swap" rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto Flex', 'sans-serif'],
                    },
                    colors: {
                        surface: '#ffffff',
                        textMain: '#0f172a',
                        textMuted: '#64748b',
                        bodyBg: '#f8fafc',
                    },
                    boxShadow: {
                        'clay': '0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1)',
                        'clay-sm': '0 1px 2px 0 rgba(0,0,0,0.05)',
                        'clay-pressed': 'inset 0 2px 4px 0 rgba(0,0,0,0.05)',
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .clay-panel {
                @apply bg-surface shadow-clay border border-slate-200 rounded-2xl;
            }
            .clay-input {
                @apply bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 pl-11
                       text-textMain placeholder-textMuted text-sm font-normal
                       focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-300
                       transition-all duration-200 w-full shadow-clay-pressed;
            }
            .clay-btn-primary {
                @apply w-full py-3.5 px-6 bg-blue-600 hover:bg-blue-700 text-white font-medium
                       rounded-xl transition-all duration-200 shadow-sm hover:shadow-md
                       active:scale-[0.98] flex items-center justify-center gap-2 text-sm;
            }
        }
        body {
            @apply bg-bodyBg text-textMain antialiased;
        }

        /* Subtle fade-in animation for the card */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 selection:bg-blue-100 selection:text-blue-900">

    <!-- Background decorative blobs -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-blue-100/60 blur-3xl"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-slate-200/60 blur-3xl"></div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full bg-indigo-50/80 blur-3xl">
        </div>
    </div>

    <!-- Login Card -->
    <div class="w-full max-w-sm clay-panel p-8 animate-fade-up">

        <!-- Logo & Branding -->
        <div class="flex flex-col items-center mb-8">
            <div
                class="w-20 h-20 rounded-full shadow-clay border border-slate-200 flex items-center justify-center bg-white overflow-hidden mb-4">
                <img src="assets/images/logo-kesbangpol.png" alt="Logo Kesbangpol"
                    class="w-full h-full object-contain p-1">
            </div>
            <h1 class="text-2xl font-black text-textMain tracking-tight">SIMBAR</h1>
            <p class="text-xs text-blue-500 font-semibold tracking-wide mt-0.5">Sistem Manajemen Barang</p>
            <p class="text-xs text-textMuted font-medium uppercase tracking-widest mt-1 text-center">Kesbangpol — Kesatuan Bangsa dan Politik</p>
        </div>

        <!-- Divider -->
        <div class="border-t border-slate-100 mb-6"></div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5">

            <!-- Email Field -->
            <div>
                <label class="block text-xs font-medium text-textMuted mb-1.5 ml-0.5" for="email">Alamat Email</label>
                <div class="relative">
                    <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-textMuted pointer-events-none"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                    </svg>
                    <input type="email" id="email" required class="clay-input" placeholder="admin@kesbangpol.id"
                        autocomplete="email" />
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label class="block text-xs font-medium text-textMuted mb-1.5 ml-0.5" for="password">Password</label>
                <div class="relative">
                    <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-textMuted pointer-events-none"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <input type="password" id="password" required class="clay-input pr-11" placeholder="••••••••"
                        autocomplete="current-password" />
                    <button type="button" id="togglePassword"
                        class="absolute right-3.5 top-1/2 -translate-y-1/2 text-textMuted hover:text-textMain transition-colors focus:outline-none"
                        title="Tampilkan/Sembunyikan Password">
                        <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeSlashIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.978 9.978 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
                <div class="flex justify-end mt-2">
                    <a href="#" onclick="handleForgotPassword(); return false;"
                        class="text-xs text-blue-600 hover:text-blue-800 transition-colors hover:underline underline-offset-2">
                        Lupa password?
                    </a>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="clay-btn-primary mt-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
                Masuk ke Sistem
            </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center my-4">
            <div class="flex-grow border-t border-slate-100"></div>
            <span class="px-3 text-xs text-textMuted font-medium uppercase tracking-wider">atau</span>
            <div class="flex-grow border-t border-slate-100"></div>
        </div>

        <!-- Demo Button -->
        <button type="button" onclick="startDemoMode()"
            class="w-full py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition-all duration-200 border border-slate-200 hover:shadow-sm active:scale-[0.98] flex items-center justify-center gap-2 text-sm">
            💡 Coba Mode Demo
        </button>

        <!-- Error Message -->
        <div id="error-msg"
            class="mt-4 text-center text-red-700 text-xs hidden bg-red-50 py-3 px-4 rounded-xl border border-red-200">
            <!-- Error message will appear here -->
        </div>

        <!-- Footer note -->
        <p class="text-center text-xs text-slate-400 mt-6">SIMBAR &copy; 2026 · Dinas Kesbangpol</p>
    </div>

    <!-- Modal Lupa Password -->
    <div id="forgot-password-modal"
        class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="clay-panel p-8 max-w-sm w-full relative transform scale-95 transition-all duration-300"
            id="forgot-password-panel">
            <div class="flex flex-col items-center text-center">
                <!-- Icon -->
                <div class="w-14 h-14 rounded-full bg-blue-50 border border-blue-100 flex items-center justify-center mb-4"
                    id="forgot-icon-wrap">
                    <svg id="forgot-icon" class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-textMain" id="forgot-title">Lupa Password?</h3>
                <p class="text-xs text-textMuted mt-1 mb-5" id="forgot-desc">
                    Masukkan email Anda untuk menerima tautan pemulihan kata sandi.
                </p>

                <div class="w-full relative mb-5" id="forgot-input-wrapper">
                    <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-textMuted pointer-events-none"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                    </svg>
                    <input type="email" id="forgot-email" class="clay-input" placeholder="admin@kesbangpol.id" />
                </div>

                <div class="flex flex-col w-full gap-2">
                    <button id="submit-forgot-btn" class="clay-btn-primary">
                        Kirim Tautan Pemulihan
                    </button>
                    <button onclick="closeForgotPasswordModal()" id="cancel-forgot-btn"
                        class="text-xs text-textMuted hover:text-textMain transition-colors py-2">
                        Batal
                    </button>
                </div>

                <div id="forgot-error-msg"
                    class="mt-3 text-center text-red-700 text-xs hidden bg-red-50 py-2.5 px-4 rounded-xl border border-red-200 w-full">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                eyeIcon.classList.toggle('hidden', type === 'text');
                eyeSlashIcon.classList.toggle('hidden', type === 'password');
            });
        }

        // Start Demo Mode
        function startDemoMode() {
            localStorage.setItem('simbar.isDemo', 'true');
            localStorage.removeItem('supabase.session');
            window.location.href = 'index.html';
        }
    </script>

    <script src="assets/js/auth.js"></script>
</body>

</html>
