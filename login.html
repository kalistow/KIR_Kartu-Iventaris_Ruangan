<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - SIM‑KIR Kesbangpol</title>
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <!-- Tailwind Config for Claymorphism -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        surface: '#DDF4E7',
                        textMain: '#124170',
                        textMuted: '#4b6680',
                        blue: {
                            50: '#F0F9F4',
                            100: '#E1F3EA',
                            200: '#C2E6D4',
                            400: '#8ACDB0',
                            500: '#67C090',
                            600: '#4DA778',
                            800: '#2A6645',
                            900: '#124170',
                        },
                        pastel: {
                            blue: '#E1F3EA',
                            blueDark: '#67C090',
                            green: '#DCFCE7',
                            red: '#FEE2E2',
                        }
                    },
                    boxShadow: {
                        'clay': '8px 8px 16px rgba(18,65,112,0.12), -8px -8px 16px rgba(255,255,255, 0.7), inset 4px 4px 8px rgba(255,255,255,0.8), inset -4px -4px 8px rgba(18,65,112,0.05)',
                        'clay-sm': '4px 4px 8px rgba(18,65,112,0.12), -4px -4px 8px rgba(255,255,255, 0.7), inset 2px 2px 4px rgba(255,255,255,0.8), inset -2px -2px 4px rgba(18,65,112,0.05)',
                        'clay-pressed': 'inset 6px 6px 12px rgba(18,65,112,0.12), inset -6px -6px 12px rgba(255,255,255, 0.7)',
                        'clay-blue': '8px 8px 16px rgba(103,192,144,0.3), -8px -8px 16px rgba(255,255,255, 0.7), inset 4px 4px 8px rgba(255,255,255,0.8), inset -4px -4px 8px rgba(103,192,144,0.1)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .clay-btn {
                @apply bg-surface text-textMain font-bold shadow-clay rounded-[2rem] transition-all duration-200 ease-in-out cursor-pointer active:shadow-clay-pressed active:scale-95;
            }
            .clay-panel {
                @apply bg-surface shadow-clay rounded-[2rem];
            }
            .clay-input {
                @apply bg-surface shadow-clay-pressed rounded-[1.5rem] py-3 pr-5 pl-12 focus:outline-none text-textMain placeholder-textMuted font-bold transition-all focus:ring-2 focus:ring-white/50 w-full;
            }
        }
        body {
            @apply bg-surface text-textMain antialiased overflow-hidden;
        }
        
        /* Floating animations for decorative elements */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes float-fast {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-5deg); }
        }
        .animate-float-slow { animation: float-slow 6s ease-in-out infinite; }
        .animate-float-fast { animation: float-fast 4s ease-in-out infinite; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative selection:bg-blue-200 selection:text-blue-900">

    <!-- Decorative Floating Clay Blobs -->
    <div class="absolute top-20 left-20 w-32 h-32 bg-pastel-blue rounded-[3rem] shadow-clay-blue animate-float-slow -z-10 opacity-70"></div>
    <div class="absolute bottom-20 right-20 w-40 h-40 bg-surface rounded-full shadow-clay animate-float-fast -z-10"></div>
    <div class="absolute top-1/4 right-1/4 w-16 h-16 bg-pastel-green rounded-full shadow-clay-sm animate-float-slow -z-10 opacity-60" style="animation-delay: 1s;"></div>
    <div class="absolute bottom-1/3 left-1/3 w-20 h-20 bg-pastel-red rounded-[2rem] shadow-clay-sm animate-float-fast -z-10 opacity-50" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-md mx-4 clay-panel p-10 relative z-10">
        
        <div class="flex flex-col items-center justify-center mb-8">
            <div class="w-20 h-20 rounded-[2rem] shadow-clay flex items-center justify-center bg-surface text-4xl mb-4">
                🏛️
            </div>
            <h2 class="text-3xl font-black text-textMain tracking-tight">SIM-KIR</h2>
            <p class="text-sm text-textMuted font-bold uppercase tracking-widest mt-1">Admin Kesbangpol</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-extrabold mb-2 ml-2 text-textMain" for="email">Email</label>
                <div class="relative">
                    <input type="email" id="email" required class="clay-input" placeholder="admin@kesbangpol.id" />
                    <svg class="w-5 h-5 absolute left-4 top-3.5 text-textMuted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-extrabold mb-2 ml-2 text-textMain" for="password">Password</label>
                <div class="relative">
                    <input type="password" id="password" required class="clay-input pr-12" placeholder="••••••••" />
                    <svg class="w-5 h-5 absolute left-4 top-3.5 text-textMuted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    
                    <button type="button" id="togglePassword" class="absolute right-4 top-3.5 text-textMuted hover:text-textMain focus:outline-none transition-colors" title="Tampilkan/Sembunyikan Password">
                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeSlashIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.978 9.978 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
                <div class="flex justify-end mt-2">
                    <a href="#" onclick="handleForgotPassword(); return false;" class="text-xs text-textMuted font-bold hover:text-textMain transition-colors underline-offset-2 hover:underline">Lupa Password?</a>
                </div>
            </div>

            <button type="submit" class="clay-btn w-full py-4 mt-4 bg-pastel-blue text-blue-900 !shadow-clay-blue text-lg tracking-wide hover:bg-blue-100 flex items-center justify-center gap-2">
                Masuk
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
        
        <div id="error-msg" class="mt-6 text-center text-red-700 font-bold text-sm hidden bg-red-100/50 py-3 rounded-2xl shadow-clay-pressed border border-red-200">
            <!-- Error message will appear here -->
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if (type === 'text') {
                    eyeIcon.classList.add('hidden');
                    eyeSlashIcon.classList.remove('hidden');
                } else {
                    eyeIcon.classList.remove('hidden');
                    eyeSlashIcon.classList.add('hidden');
                }
            });
        }
    </script>
    <!-- Modal Lupa Password -->
    <div id="forgot-password-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-surface shadow-clay rounded-[2rem] p-8 max-w-sm w-full mx-4 relative transform scale-95 transition-all duration-300" id="forgot-password-panel">
            <div class="flex flex-col items-center text-center">
                <div class="w-16 h-16 rounded-[1.5rem] shadow-clay flex items-center justify-center bg-surface text-3xl mb-4" id="forgot-icon">
                    🔑
                </div>
                <h3 class="text-xl font-black text-textMain" id="forgot-title">Lupa Password?</h3>
                <p class="text-xs text-textMuted font-bold mt-2 mb-6" id="forgot-desc">Masukkan email Anda untuk menerima tautan pemulihan kata sandi.</p>
                
                <div class="w-full relative mb-6" id="forgot-input-wrapper">
                    <input type="email" id="forgot-email" class="clay-input" placeholder="admin@kesbangpol.id" />
                    <svg class="w-5 h-5 absolute left-4 top-3.5 text-textMuted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                </div>

                <div class="flex flex-col w-full gap-3">
                    <button id="submit-forgot-btn" class="clay-btn w-full py-3.5 bg-pastel-blue text-blue-900 !shadow-clay-blue text-base font-bold flex items-center justify-center gap-2">
                        Kirim Tautan
                    </button>
                    <button onclick="closeForgotPasswordModal()" id="cancel-forgot-btn" class="text-sm text-textMuted font-bold hover:text-textMain transition-colors py-2">
                        Batal
                    </button>
                </div>
                
                <div id="forgot-error-msg" class="mt-4 text-center text-red-700 font-bold text-xs hidden bg-red-100/50 py-2.5 px-4 rounded-xl border border-red-200 w-full"></div>
            </div>
        </div>


    <script src="assets/js/auth.js"></script>
</body>
</html>
